# Compose file for the tooth-resorption inference API.
#
# Build from the repository root:
#     docker compose -f deployment/docker-compose.yml up --build
#
# The build context is the repository root so the Dockerfile can copy in
# pyproject.toml, src/, and deployment/. Models are mounted read-only from
# the host - never bake patient-derived weights into the image.

services:
  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: tooth-resorption-api:latest
    container_name: trd-api
    ports:
      - "5000:5000"
    volumes:
      - ../models:/app/models:ro
    environment:
      - FLASK_ENV=production
      - TRD_DEVICE=cpu
      - TRD_PORT=5000
      - TRD_MODEL_PATH=/app/models/vit_base_16_best.pt
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health').getcode()==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
