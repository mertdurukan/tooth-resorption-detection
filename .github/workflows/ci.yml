name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: lint + type + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (CPU torch + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src scripts tests

      - name: Ruff format check
        run: ruff format --check src scripts tests

      - name: Mypy
        run: |
          set +e
          mypy src 2>&1 | tee mypy.log
          MYPY_EXIT=${PIPESTATUS[0]}
          # Emit GitHub Actions ::error:: annotations for every mypy error so
          # the failure is visible via the public check-runs/annotations API
          # (workflow logs themselves still require repo-admin auth).
          awk -F':' '
            /^[^ ].*: error:/ {
              file=$1; line=$2; col=$3;
              msg="";
              for (i=4; i<=NF; i++) msg = msg (i>4 ? ":" : "") $i;
              sub(/^[ ]+/, "", msg);
              printf "::error file=%s,line=%s,col=%s::%s\n", file, line, col, msg;
            }
          ' mypy.log
          exit $MYPY_EXIT

      - name: Pytest
        run: pytest --cov=tooth_resorption --cov-report=term-missing
