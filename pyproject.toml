[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tooth-resorption-detection"
version = "0.2.0"
description = "Wisdom-tooth root resorption detection on dental X-rays: CNN baseline vs ImageNet-pretrained ViT-Base/16 and the attention/transformer model zoo."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Mert Durukan" }]
keywords = [
    "medical-imaging",
    "computer-vision",
    "dental-xray",
    "vision-transformer",
    "transfer-learning",
    "pytorch",
    "timm",
    "yolo",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24,<2.0",
    "pandas>=2.0",
    "Pillow>=10.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "PyYAML>=6.0",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=0.9",
    "einops>=0.6",
]

[project.optional-dependencies]
detection = [
    "ultralytics>=8.0",
    "opencv-python>=4.8",
]
tensorflow = [
    "tensorflow>=2.13,<2.16",
]
deployment = [
    "onnx>=1.14",
    "onnxruntime>=1.15",
    "flask>=2.0",
]
tracking = [
    "mlflow>=2.0",
]
dev = [
    # Tools pinned to exact versions to eliminate CI/local drift. Without
    # exact pins, a fresh CI venv resolves to the latest release on PyPI
    # while existing local venvs keep older cached versions; the resulting
    # behaviour differences (especially in ``ruff`` and ``mypy``) caused
    # four "works locally, fails on CI" iterations before this commit.
    # When bumping, recreate ``.venv-ci`` from scratch and re-run the
    # full CI command list (``ruff check``, ``ruff format --check``,
    # ``mypy src``, ``pytest --cov``) before committing the new pins.
    "ruff==0.15.14",
    "mypy==2.1.0",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pre-commit==4.6.0",
    "types-Pillow==10.2.0.20240822",
    "types-PyYAML==6.0.12.20260518",
    # Required at test-collection time by ``tests/test_flask_api.py``,
    # which imports ``deployment.api.flask_api``. Without ``flask`` in the
    # dev extras, CI installs only this group and pytest errors out with
    # ``ModuleNotFoundError: No module named 'flask'`` for four tests.
    # Flask itself is also exposed via the ``deployment`` extras, but
    # tests must be runnable from the minimal dev install alone.
    "flask>=3.0,<4.0",
]
notebook = [
    "jupyter>=1.0",
    "ipykernel>=6.25",
]

[project.urls]
Homepage = "https://github.com/mertdurukan/tooth-resorption-detection"
Repository = "https://github.com/mertdurukan/tooth-resorption-detection"
Issues = "https://github.com/mertdurukan/tooth-resorption-detection/issues"

[project.scripts]
trd-train = "tooth_resorption.training.train:main"
trd-evaluate = "tooth_resorption.evaluation.evaluate:main"
trd-plot = "tooth_resorption.visualization.plot_comparison:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["tooth_resorption*"]

[tool.setuptools.package-data]
tooth_resorption = ["py.typed"]

# --------------------------------------------------------------------------- #
# Ruff: lint + format                                                          #
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks", "data", "results", "models", "deployment", "runs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "ARG", # unused arguments
    "PTH", # pathlib
    "RUF", # ruff-specific
]
ignore = [
    "E501",
    "B008",
    "N812",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
"src/tooth_resorption/__init__.py" = ["F401"]
"src/tooth_resorption/*/__init__.py" = ["F401"]
"scripts/*" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["tooth_resorption"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# --------------------------------------------------------------------------- #
# Mypy: static type-checking                                                   #
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_decorators = false
# numpy generics (e.g. ``np.ndarray``) are routinely used without an explicit
# dtype parameter across the legacy modules — keep strict mode on but allow
# bare numpy generics so the type checker focuses on real bugs.
disallow_any_generics = false
# torch / timm have no PEP-561 stubs, so their classes are typed ``Any``;
# allow subclassing ``nn.Module`` (etc.) without nagging mypy.
disallow_subclassing_any = false
files = ["src"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "torch",
    "torch.*",
    "timm",
    "timm.*",
    "torchvision",
    "torchvision.*",
    "sklearn",
    "sklearn.*",
    "matplotlib",
    "matplotlib.*",
    "PIL",
    "PIL.*",
    "tensorflow",
    "tensorflow.*",
    "ultralytics",
    "ultralytics.*",
    "mlflow",
    "mlflow.*",
    "pandas",
    "pandas.*",
    "yaml",
    "cv2",
    "seaborn",
    "seaborn.*",
]
ignore_missing_imports = true

# Legacy modules: pre-existing thesis code that uses dynamic torch attributes
# (Tensor | Module unions, ultralytics.YOLO re-export, matplotlib colormap
# attribute access) and would require a structural refactor to satisfy mypy
# strict. The 17 newer modules in the package are still type-checked strictly;
# these five are excluded until they are rewritten in a follow-up PR.
[[tool.mypy.overrides]]
module = [
    "tooth_resorption.models.architectures",
    "tooth_resorption.training.train_attention",
    "tooth_resorption.evaluation.model_comparison",
    "tooth_resorption.detection.yolo_detector",
    "tooth_resorption.visualization.saliency",
]
ignore_errors = true

# --------------------------------------------------------------------------- #
# Pytest                                                                       #
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q --tb=short --strict-markers"
markers = [
    "slow: tests that take more than a few seconds",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
